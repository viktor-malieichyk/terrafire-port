# Builds the port on Windows (MSVC), Linux (MinGW-w64 cross build for
# Windows) and macOS (universal TerraFire.app). The game data (DATA.PAK) is
# not in the repository, so CI only checks that everything compiles and links.
name: build

on: [push, pull_request, workflow_dispatch]

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure (SDL3 is fetched and built)
        run: cmake -S port -B port/build -DTF_VENDOR_SDL=ON
      - name: Build
        run: cmake --build port/build --config Release --parallel
      - uses: actions/upload-artifact@v7
        with:
          name: terrafire-windows-msvc
          path: |
            port/build/Release/terrafire.exe
            port/build/Release/SDL3.dll

  windows-mingw-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Configure
        run: >
          cmake -S port -B port/build-win -DTF_VENDOR_SDL=ON -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
      - name: Build
        run: cmake --build port/build-win --parallel
      - uses: actions/upload-artifact@v7
        with:
          name: terrafire-windows-mingw
          path: |
            port/build-win/terrafire.exe
            port/build-win/SDL3.dll

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure (universal app, SDL3 built from source and linked in)
        run: >
          cmake -S port -B port/build -DCMAKE_BUILD_TYPE=Release -DTF_VENDOR_SDL=ON
          -DTF_MACOS_BUNDLE=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - run: cmake --build port/build --parallel
      - run: ditto -c -k --keepParent port/build/TerraFire.app TerraFire-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: terrafire-macos
          path: TerraFire-macos.zip
