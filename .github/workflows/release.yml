# Pushing a tag vX.Y.Z builds the Windows and macOS packages and publishes
# them as a GitHub release. Notes come from .github/release-notes/<tag>.md
# when it exists, else GitHub generates them from the commits.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S port -B port/build -DTF_VENDOR_SDL=ON
      - run: cmake --build port/build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          $dir = "TerraFire-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item port/build/Release/terrafire.exe, port/build/Release/SDL3.dll, LICENSE $dir
          Copy-Item port/res/release-readme.txt "$dir/README.txt"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: TerraFire-*-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          cmake -S port -B port/build -DCMAKE_BUILD_TYPE=Release -DTF_VENDOR_SDL=ON
          -DTF_MACOS_BUNDLE=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
      - run: cmake --build port/build --parallel
      - name: Package
        run: |
          dir="TerraFire-${{ github.ref_name }}-macos"
          mkdir "$dir"
          cp -R port/build/TerraFire.app LICENSE "$dir/"
          cp port/res/release-readme.txt "$dir/README.txt"
          ditto -c -k --keepParent "$dir" "$dir.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: TerraFire-*-macos.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" dist/*.zip --title "TerraFire $TAG" "$@"
